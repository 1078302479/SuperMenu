function toolboxCheck(key,label,help=false){return `<div class="toolbox-option"><label class="check"><input type="checkbox" ${toolboxPrefs[key]?'checked':''} onchange="toolboxPrefs['${key}']=this.checked;applyToolboxIcons()">${label}</label>${help?`<button class="option-help" aria-label="${label}说明" onclick="toolboxHelp('${key}')">?</button>`:''}</div>`}
function applyToolboxIcons(){document.querySelectorAll('.tablebox .original-icon,.tablebox .smallicon').forEach(el=>el.style.visibility=toolboxPrefs.icons?'visible':'hidden')}
function toolboxHelp(key){const info={files:['合并文件（夹）右键菜单','勾选后，文件信息、拷贝名称、剪切等文件操作收纳到同一个子菜单；取消勾选则分别显示。'],images:['合并图片转换右键菜单','勾选后，PNG、JPG、WebP、HEIC、ICNS 和图标集等转换操作收纳到同一个子菜单。'],apps:['合并进入 App 右键菜单','勾选后，终端、编辑器和自定义应用入口收纳到同一个子菜单。']};show(info[key][0],`<p>${info[key][1]}</p><p>当前保存的是设计稿中的演示状态，尚未连接 Finder 菜单。</p>`)}
function deleteApp(){if(selected<0||!tools[selected]?.[4])return toast('仅可删除自己添加的应用入口');tools.splice(selected,1);render();toast('已删除自定义应用入口')}
function requestFeature(){show('申请其他功能','<p>描述你希望增加的右键功能和使用场景。</p><textarea id="featureText" aria-label="功能需求" placeholder="例如：批量重命名照片，保留原始拍摄时间…"></textarea><p>当前设计稿仅本地预览，不会发送反馈。</p>',btn('取消','closeModal()')+btn('保存需求草稿',"let text=$('#featureText').value.trim();if(text){featureDraft=text;closeModal();toast('需求已暂存于本次预览，未发送')}else{$('#featureText').focus()}",'blue'));$('#featureText').value=featureDraft}
let featureDraft='';
function resetToolbox(){show('重置工具箱设置？','<p>将恢复功能名称、启用状态和菜单合并选项，并移除本次预览添加的自定义应用。</p>',btn('取消','closeModal()')+btn('重置',"tools=JSON.parse(JSON.stringify(initialTools));toolboxPrefs={icons:true,files:false,images:false,apps:false};closeModal();render();toast('已恢复工具箱初始设置')",'blue'))}

function selectRow(el,i){document.querySelectorAll('tr.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=i;if(page===5&&$('#deleteApp'))$('#deleteApp').disabled=!tools[i]?.[4]}function filterTools(s){document.querySelectorAll('[data-tool]').forEach(e=>e.hidden=!e.dataset.tool.toLowerCase().includes(s.toLowerCase()))}function closeModal(){$('#modal').close()}function show(title,body,buttons=''){$('#modal').className='';$('#modal').innerHTML=`<h2>${title}</h2>${body}<div class="buttons">${buttons||btn('完成','closeModal()','blue')}</div>`;$('#modal').showModal()}
function addItem(){if(page===1)show('添加模板文件','<p>为自己的文档模板设置名称。当前仅添加演示条目。</p><input id="itemName" type="text" placeholder="例如：会议纪要"><input id="itemExt" type="text" placeholder="扩展名，例如 docx">',btn('取消','closeModal()')+btn('添加','saveItem()','blue'));else show('添加常用目录','<p>原生版本通过系统目录选择器授权；此处填写演示信息。</p><input id="itemName" type="text" placeholder="显示名称"><input id="itemExt" type="text" placeholder="目录路径">',btn('取消','closeModal()')+btn('添加','saveItem()','blue'))}function saveItem(){let n=$('#itemName').value.trim(),e=$('#itemExt').value.trim();if(!n)return $('#itemName').focus();if(page===1)templates.push([n,e||'txt',true]);else(page===2?dirs:common).push([n,e||'~/Documents']);closeModal();render();toast('已添加演示条目')}function removeItem(){if(selected<0)return toast('请先选择一行');if(page===1){if(selected<16)return toast('内置模板可关闭，自定义模板可删除');templates.splice(selected,1)}else(page===2?dirs:common).splice(selected,1);render();toast('已移除演示条目')}function resetDemo(){toast('原型未保存系统设置；刷新页面恢复初始数据')}function addApp(){show('新建进入 App','<p>原生版本选择已安装的应用；这里先设置演示名称。</p><input type="text" id="appName" placeholder="应用名称">',btn('取消','closeModal()')+btn('添加',"let n=$('#appName').value.trim();if(n){tools.push(['进入 '+n,'terminal','',true,true]);closeModal();render()}",'blue'))}function about(){show('SuperMenu','<p>浅色桌面工具界面：清晰的功能分区、紧凑表格、统一线条图标。应用图标以高亮鼠标右键和弹出菜单表达用途。</p><p>这是可点击设计稿，文件操作与权限操作均未接入。左上角应用图标为自行绘制，其余功能图标尽量保留本地参考应用的原始资源。</p>')}
function preview(){show('右键菜单预览','<p>按场景展示菜单结构，最终由 macOS 原生菜单绘制。</p><div class="menupreview"><div class="contexts">'+['空白处','文件','文件夹','图片'].map(s=>btn(s,`ctx='${s}';menuContent()`)).join('')+'</div><div id="menu"></div></div><div class="menuhint">常用动作直显，其他动作可按类别收纳。这里只演示展示效果。</div>');$('#modal').className='previewdialog';menuContent()}function menuContent(){let items=ctx==='空白处'?['新建文件夹','|','新建文件 ›','常用目录 ›','iShot 截图','拷贝路径','进入终端']:['打开','显示简介','|','新建文件 ›','移动文件到… ›','复制文件到… ›','文件（夹）图标 ›',...(ctx==='文件'?['文件信息 ›']:[]),'剪切','拷贝路径',...(ctx==='文件夹'?['解散文件夹','进入终端']:[]),...(ctx==='图片'?['转换图片 ›','设置为墙纸']:[])];$('#menu').innerHTML=`<div class="native-menu">${items.map(x=>x==='|'?'<hr>':`<div class="mi ${x==='新建文件 ›'?'hl':''}"><span>${x.replace(' ›','')}</span><span>${x.endsWith('›')?'›':''}</span></div>`).join('')}</div>`}function actionPreview(){let x=tools[selected];if(!x)return toast('请先选中一个工具');if(x[1]==='trash'){show('彻底删除所选项目？','<p>文件将直接删除，不会进入废纸篓，无法撤销。</p><p>此处仅演示确认界面，不会删除任何文件。</p>',btn('取消','closeModal()')+btn('删除（演示）',"closeModal();toast('未删除任何文件')",'danger'))}else show(x[0],'<p>正式版本在此展示目标文件、操作选项和执行结果。</p><p>当前为界面预览，不执行本地任务。</p>')}
render();
</script></body></html>
